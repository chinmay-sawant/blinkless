# golangci-lint configuration for blinkless (golangci-lint v2 schema).
# Pinned runner: v2.15.0 via `make lint` (GOLANGCI_LINT_VERSION in the
# Makefile). Curated correctness, security, and maintainability set; not
# enable-all. Docs: https://golangci-lint.run/usage/configuration/
#
# Toolchain note: this module is go 1.26 / toolchain go1.26.4. golangci-lint
# must be built with Go >= the module version (see the Makefile).
#
# Every //nolint needs a named linter and an explanation, and an unused
# directive fails the gate (nolintlint below). A directive naming a linter
# that is not enabled here is therefore also an error.
version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - fatcontext
    - gocritic
    - gosec
    - govet
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - nolintlint
    - predeclared
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usetesting
    - wastedassign
  settings:
    staticcheck:
      # QF* are editor quickfix rewrites (De Morgan, tagged switch, embedded
      # field selectors), not defects. The ST* exclusions are staticcheck's
      # own defaults (package comments, naming, receiver and error-string
      # style); SA* and S1* correctness and simplification checks stay on.
      checks:
        - all
        - -QF*
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - node_modules
      - frontend/dist
      # Scratch programs under temps are exploratory artifacts, not product
      # packages. They have never been part of the supported build or test path.
      - temps

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - node_modules
      - frontend/dist
      - temps
