# golangci-lint configuration for blinkless.
# Uses a curated correctness, security, and maintainability linter set
# compatible with golangci-lint v1.64.8.
# Docs: https://golangci-lint.run/usage/configuration/
#
# Toolchain note: this module is go 1.26 / toolchain go1.26.4.
# golangci-lint must be built with Go >= the module version (see Makefile).

run:
  timeout: 10m
  tests: true

linters:
  disable-all: true
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - fatcontext
    - gocritic
    - gofmt
    - gosec
    - govet
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - nolintlint
    - predeclared
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usetesting
    - wastedassign

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - node_modules
    - frontend/dist
    # bindings/wasm is a js/wasm entry point validated by make wasm-test.
    - bindings/wasm
    # Scratch programs under temps are exploratory artifacts, not product
    # packages. They have never been part of the supported build or test path.
    - temps

output:
  sort-results: true
