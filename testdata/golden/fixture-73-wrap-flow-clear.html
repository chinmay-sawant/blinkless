<!DOCTYPE html>
<!--
  fixture-73-wrap-flow-clear
  Proves: wrap-flow: clear leaves the areas beside the exclusion empty, so
  the following paragraph's first line drops below the box (the same Y
  outcome as clear: both past a float).
  Expected: the first line's baseline is at or below the exclusion's bottom.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>wrap-flow clear</title>
  <style>
    body { font-family: monospace; font-size: 10pt; margin: 0; width: 200pt; color: #222; }
    #exc { wrap-flow: clear; width: 60pt; height: 30pt; background: #ddd; }
    p { margin: 0; }
  </style>
</head>
<body>
  <div id="exc"></div>
  <p id="p">alpha bravo charlie delta echo foxtrot golf hotel india juliet kilo lima</p>
</body>
</html>
