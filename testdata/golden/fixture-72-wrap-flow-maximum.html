<!DOCTYPE html>
<!--
  fixture-72-wrap-flow-maximum
  Proves: wrap-flow: maximum places the following paragraph on the side with
  the larger free gap. The box sits at margin-left 120pt in a 200pt content
  box, so the left gap (120pt) is larger: lines end at the box's left edge.
  Expected: the first line's right edge is at or before the exclusion's left
  edge.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>wrap-flow maximum</title>
  <style>
    body { font-family: monospace; font-size: 10pt; margin: 0; width: 200pt; color: #222; }
    #exc { wrap-flow: maximum; margin-left: 120pt; width: 60pt; height: 30pt; background: #ddd; }
    p { margin: 0; }
  </style>
</head>
<body>
  <div id="exc"></div>
  <p id="p">alpha bravo charlie delta echo foxtrot golf hotel india juliet kilo lima</p>
</body>
</html>
