<!DOCTYPE html>
<!--
  fixture-69-wrap-flow-start
  Proves: wrap-flow: start on a sized box makes the following paragraph flow
  beside the box's start edge (LTR: the line stays left of the box) and
  leaves the end side empty. The box itself stays put.
  Expected: the first line's right edge ends at the exclusion's left edge.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>wrap-flow start</title>
  <style>
    body { font-family: monospace; font-size: 10pt; margin: 0; width: 200pt; color: #222; }
    #exc { wrap-flow: start; margin-left: 120pt; width: 60pt; height: 30pt; background: #ddd; }
    p { margin: 0; }
  </style>
</head>
<body>
  <div id="exc"></div>
  <p id="p">alpha bravo charlie delta echo foxtrot golf hotel india juliet kilo lima</p>
</body>
</html>
