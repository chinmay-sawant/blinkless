<!DOCTYPE html>
<!--
  fixture-76-flow-tolerance-non-masonry-grid
  Proves: flow-tolerance is a masonry-only knob. Two identical non-masonry
  grids (grid-template-rows: auto) with the same items; only #g1 sets
  flow-tolerance: 0px. Expected: every item's geometry matches between the
  two grids.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>flow-tolerance ignored by a non-masonry grid</title>
  <style>
    body { font-family: monospace; font-size: 10pt; margin: 0; color: #222; }
    .grid { display: grid; grid-template-columns: 100pt 100pt; column-gap: 10pt; width: 210pt; }
    #g1 { flow-tolerance: 0px; }
    .tall { height: 60pt; }
    .short { height: 20pt; }
  </style>
</head>
<body>
  <div id="g1" class="grid">
    <div class="short">grid one A</div>
    <div class="tall">grid one B</div>
  </div>
  <div id="g2" class="grid">
    <div class="short">grid two A</div>
    <div class="tall">grid two B</div>
  </div>
</body>
</html>
