<!DOCTYPE html>
<!--
  fixture-66-named-flow-element-move
  Proves: flow-into: article element moves the whole source box into the
  flow-from region. The source's border stroke and its text paint inside the
  region's box instead of the source's old flow position.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>Named flow element move</title>
  <style>
    body { font-family: monospace; font-size: 10pt; margin: 0; color: #222; }
    #src { border: 1pt solid black; padding: 2pt; }
    #b { flow-from: article; border: 1pt solid #888; padding: 2pt; }
  </style>
</head>
<body>
  <div id="src" style="flow-into: article element">element source words</div>
  <div id="b"></div>
</body>
</html>
