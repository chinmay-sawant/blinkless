<!DOCTYPE html>
<html style="margin:0">
<body style="margin:0;background:#f4f0e8;color:#1c1917;font:16px sans-serif">
<div style="padding:28px">
<p style="margin:0 0 8px;font-size:26px">break-inside</p>
<p style="margin:0 0 20px;width:640px">Three 40px boxes in a 300px, two-column row with a 20px gap. The middle box crosses the balanced column break. auto leaves it under the first box. avoid moves it whole into column 2.</p>
<div style="display:flex;gap:32px;align-items:flex-start">
<div>
<p style="margin:0 0 8px">auto</p>
<div id="auto" style="width:300px;column-count:2;column-gap:20px">
<div id="a1" style="box-sizing:border-box;height:40px;border:3px solid #1d4ed8;background:#dbeafe">k1</div>
<div id="a2" style="box-sizing:border-box;height:40px;border:3px solid #c2410c;background:#ffedd5;break-inside:auto">k2</div>
<div id="a3" style="box-sizing:border-box;height:40px;border:3px solid #15803d;background:#dcfce7">k3</div>
</div>
</div>
<div>
<p style="margin:0 0 8px">avoid</p>
<div id="avoid" style="width:300px;column-count:2;column-gap:20px">
<div id="k1" style="box-sizing:border-box;height:40px;border:3px solid #1d4ed8;background:#dbeafe">k1</div>
<div id="k2" style="box-sizing:border-box;height:40px;border:3px solid #c2410c;background:#ffedd5;break-inside:avoid">k2</div>
<div id="k3" style="box-sizing:border-box;height:40px;border:3px solid #15803d;background:#dcfce7">k3</div>
</div>
</div>
</div>
</div>
</body>
</html>
