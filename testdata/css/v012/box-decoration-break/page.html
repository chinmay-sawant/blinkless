<!DOCTYPE html>
<html style="margin:0">
<body style="margin:0;background:#f4f0e8;color:#1c1917">
<div style="padding:32px">
<p style="margin:0 0 8px;font-size:26px">box-decoration-break</p>
<p style="margin:0 0 20px;font-size:16px;width:520px">Top is slice: one red bar for the whole phrase. Bottom is clone: each line is its own red box.</p>
<p style="margin:0 0 8px;font-size:14px">One bar</p>
<p style="width:180px;margin:0 0 28px;font-size:22px">
<span id="slice" style="background:#f00;padding:3px 8px;box-decoration-break:slice">slice one red bar across the wrap</span>
</p>
<p style="margin:0 0 8px;font-size:14px">A box on every line</p>
<p style="width:180px;margin:0;font-size:22px">
<span id="clone" style="background:#f00;padding:3px 8px;border:2px solid #111;box-decoration-break:clone">clone a red box on every line</span>
</p>
</div>
</body>
</html>
