<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>all</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  .parent { color: red; background-color: blue; direction: rtl; padding: 16px; }
  .initial { all: initial; }
  .copy { all: inherit; }
  p { margin: 8px; padding: 8px; }
</style>
</head>
<body>
  <div class="parent">
    <p class="initial">all initial</p>
    <p class="copy">all inherit</p>
  </div>
</body>
</html>
