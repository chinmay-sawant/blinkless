<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS mask group reference</title>
  <style>
    html, body {
      width: 380px;
      height: 140px;
      margin: 0;
      background: rgb(0, 160, 0);
    }

    .masked {
      position: absolute;
      top: 20px;
      box-sizing: border-box;
      width: 160px;
      height: 100px;
      border: 8px solid rgb(0, 0, 255);
      background: rgb(230, 30, 30);
      mask-size: 100% 100%;
      mask-repeat: no-repeat;
    }

    #alpha {
      left: 20px;
      mask-image: url(alpha-half.png);
      mask-mode: match-source;
    }

    #luminance {
      left: 200px;
      mask-image: url(luminance-half.png);
      mask-mode: luminance;
    }

    .child {
      position: absolute;
      left: 60px;
      top: 60px;
      width: 80px;
      height: 20px;
      background: rgb(255, 220, 0);
      color: white;
      font: 16px/20px sans-serif;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="alpha" class="masked"><div class="child">MASK</div></div>
  <div id="luminance" class="masked"><div class="child">MASK</div></div>
</body>
</html>
