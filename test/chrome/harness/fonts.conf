<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  CSS-REVIEW-01 comparison config.

  Blinkless embeds Liberation Sans and maps the generic families
  (sans-serif / Arial / Helvetica) to it. The browser resolves those generics
  through fontconfig, where this host maps sans-serif to DejaVu Sans. That
  changes text advances and line breaks, which is a font substitution, not a
  layout difference. Pointing the generics at the installed Liberation Sans
  makes browser text metrics comparable with the embedded face.

  Used only when FONTCONFIG_FILE is exported for the capture run.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <glob>*.woff2</glob>
      <glob>*.woff</glob>
    </rejectfont>
  </selectfont>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Helvetica</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
</fontconfig>
