  <title>Flex container min-content contribution</title>
  <style>
    /* Print 1:1 with the Chromium reference: no smart shrinking. The 8pt
       page margin keeps every edge inside the page, and the 550pt panel

    html, body { margin: 0; padding: 0; }
    .wrap { width: 0; height: 0; margin-bottom: 8pt; }
    .case { position: relative; transform: translateY(56pt); display: flex; width: min-content; height: min-content; }
    .item { margin: 5pt; padding: 3pt; border: 2pt solid #9ec5fe; }
    .small { width: 30pt; } .large { width: 40pt; }
  </style>

  <!-- Source: third_party/blink/web_tests/external/wpt/css/css-flexbox/flex-container-min-content-001.html -->
  <!-- Fixture: case-40-wpt-flex-container-min-content -->
  <!-- Port status: blocked. Box deltas remain because layout is pt-exact by design: the height:0 wrapper matches Chrome at 0x0, the min-content frame is 146.67x62.67 vs Chrome 143.95x61.31, and the items are +1.33 px, the 2 pt border measuring 2.67 px per side in layout where Chrome computes 2 px. Screen paint at dsf 1 matches Chrome: the display-list snap turns 2 pt (2.67 px) strokes into 2 px and 1 pt (1.33 px) into 1 px, Chrome's computed widths (temps/chrome-cases/dsf-rerun/paint-width-validation.md). At fractional dsf the snap floors cssPx*dsf to whole device pixels, so 2 pt at dsf 1.25/1.5/2 paints 3/4/5 device px vs Chrome's 2.5/3/4 (temps/chrome-cases/dsf/report.md). -->
  <!-- Expected: the container uses the largest constrained outer contribution. -->

    <strong>Case 40 expected behavior:</strong> the min-content container keeps the largest constrained outer contribution, placing the 40pt and 50pt items.
  </p>
