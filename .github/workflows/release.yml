# This workflow does not check versions against committed files.
# The only gates are make test and make lint.
#
# Trigger: push of a v* tag only (never PR / ordinary branch push).
#   git tag v0.0.2 && git push origin v0.0.2
# Creates or updates the GitHub Release with generated notes. No binaries
# are attached.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: test + lint + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Test
        run: make test

      - name: Put GOPATH/bin on PATH
        # `make lint` installs the pinned golangci-lint (GOLANGCI_LINT_VERSION
        # in the Makefile) into GOPATH/bin when it is missing.
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: make lint

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
