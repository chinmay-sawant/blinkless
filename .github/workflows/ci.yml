name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Test
        run: make test
      - name: Claim scan
        run: make claim-scan
      - name: Catalog check
        run: make catalog-check
      - name: Matrix sync check
        run: make matrix-check
      - name: Install golangci-lint
        # Build with the job's Go (1.26+): v1.64 refuses to lint when the binary
        # was compiled with an older Go than go.mod targets.
        run: GOTOOLCHAIN=local go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Lint
        run: make lint

  build:
    name: static build (CGO_ENABLED=0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Build packages
        run: CGO_ENABLED=0 go build ./...
      - name: Purity guard (cgo only allowed in bindings/c)
        # Phase 40.4 drift guard: under CGO_ENABLED=0 no package may carry
        # CgoFiles except the opt-in bindings/c facade.
        run: |
          set -euo pipefail
          offenders=$(CGO_ENABLED=0 go list -json ./... \
            | jq -r 'select(.CgoFiles and (.CgoFiles|length>0)) | .ImportPath')
          status=0
          while IFS= read -r pkg; do
            [ -z "${pkg}" ] && continue
            case "${pkg}" in
              github.com/chinmay-sawant/blinkless/bindings/c) ;;
              *)
                echo "purity guard: cgo files outside bindings/c: ${pkg}" >&2
                status=1
                ;;
            esac
          done <<< "${offenders}"
          if [ "${status}" -eq 0 ]; then
            echo "purity guard ok: cgo confined to bindings/c"
          fi
          exit "${status}"

  race:
    name: race (hot packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Race
        # Caps match make test / make test-race: -race roughly doubles RSS and
        # uncapped parallel fixtures thrash ~7 GiB runners.
        run: make test-race

  wasm:
    name: WASM adapter and browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/puppeteer/package-lock.json
      - name: Install browser test deps
        run: npm ci --prefix scripts/puppeteer
      - name: Run WASM contract, build, and browser tests
        run: make wasm-test

  # GATE-06a/GATE-06b fast evidence bundle: parser corpus twice with a
  # byte-compare, catalog/matrix/claim gates, browser comparison, WASM
  # contract, and node consumer check. A browser the runner lacks is recorded
  # as a skipped comparison, not a failure. The heavy gates (make test /
  # golden / lint) stay in the test job; use `make final-evidence
  # FINAL_EVIDENCE_FLAGS=--full` locally to run the whole GATE-06a list.
  final-evidence:
    name: final evidence (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fast final-evidence bundle
        run: make final-evidence

  # --- Phases 40.5 / 44.4: opt-in cgo CI. These jobs never feed back into
  # the pure-Go default targets above; CGO_ENABLED=1 is set per step only.
  build-shared:
    name: c-shared build (CGO_ENABLED=1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Build c-shared library
        env:
          CGO_ENABLED: "1"
        run: make c-shared
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify ABI and version stamp via ctypes
        # Loads dist/libblinkless.so out-of-process from Python and pins
        # the frozen contract: blinkless_abi_version() == 1 and
        # blinkless_version() == the version stamped by make c-shared.
        run: |
          want=$(make -s print-bindings-version)
          python3 - "$want" <<'PY'
          import ctypes
          import sys

          lib = ctypes.CDLL("dist/libblinkless.so")
          lib.blinkless_abi_version.argtypes = []
          lib.blinkless_abi_version.restype = ctypes.c_int32
          lib.blinkless_version.argtypes = []
          lib.blinkless_version.restype = ctypes.c_char_p

          abi = lib.blinkless_abi_version()
          got = lib.blinkless_version().decode("utf-8")
          want = sys.argv[1]

          assert abi == 1, f"abi_version() = {abi}, want 1"
          assert got == want, f"version() = {got!r}, want {want!r}"
          print(f"c-shared ok: abi={abi} version={got}")
          PY

  python-binding:
    name: python binding suite
    needs: build-shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build c-shared library
        env:
          CGO_ENABLED: "1"
        run: make c-shared
      - name: Install python binding (editable)
        run: pip install -e ./bindings/python
      - name: Run unittest suite
        run: python3 -m unittest discover -s bindings/python/tests -t . -v
