# CI runs tests, race checks, lint, and catalog/matrix/claim checks.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test + lint + checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache: true
      - name: Test
        run: make test
      - name: Test race
        run: make test-race
      - name: Claim scan
        run: make claim-scan
      - name: Catalog check
        run: make catalog-check
      - name: Matrix check
        run: make matrix-check
      - name: Install golangci-lint
        # Build with the job's Go (1.26+): v1.64 refuses to lint when the binary
        # was compiled with an older Go than go.mod targets.
        run: GOTOOLCHAIN=local go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Lint
        run: make lint
