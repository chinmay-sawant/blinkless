# CI runs only make test and make lint.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Test
        run: make test
      - name: Install golangci-lint
        # Build with the job's Go (1.26+): v1.64 refuses to lint when the binary
        # was compiled with an older Go than go.mod targets.
        run: GOTOOLCHAIN=local go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Lint
        run: make lint
